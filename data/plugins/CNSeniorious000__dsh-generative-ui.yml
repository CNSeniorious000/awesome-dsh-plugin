url: https://github.com/CNSeniorious000/dsh-generative-ui
name: CNSeniorious000/dsh-generative-ui
category: ui
description:
  en: Streams model-written React/TSX while the reply is still being generated, inline in chat or in a persistent Canvas side panel, with npm imports and DSH bindings for state, chat, files, web search, model calls, and sandboxed commands.
  zh: 在回复仍在生成时流式渲染模型编写的 React/TSX，可内嵌于对话或显示在持久的 Canvas 侧栏中，并支持 npm 导入及状态、聊天、文件、网页搜索、模型调用和沙箱命令等 DSH 绑定。
